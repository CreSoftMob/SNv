  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />

    <meta name="description" content="👍 SameNext: O Painel de Acessibilidade Bilateral para o seu Negócio." />
    <meta name="keywords" content="SameNext, same next, acessibilidade, libras, PWA, app, web app" />
    <meta name="author" content="SameNext" />
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="shortcut icon" type="image/png" href="https://samenext.com.br/logo.png" />

    <style id="expo-reset">
      html, body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17817754700"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17817754700');
    </script>
  </head>

  <body>
    <noscript>
      Você precisa ativar o JavaScript para executar este aplicativo.
    </noscript>

    <!-- Elemento Raiz do React Native Web / Expo -->
    <div id="root"></div>

    <!-- Estrutura HTML Oculta do VLibras (Só é ativada por script) -->
    <div vw class="enabled" style="display: none;" id="vlibras-container">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <!-- Script de Carregamento Sob Demanda do VLibras -->
    <script>
      window.vlibrasCarregado = false;

      window.carregarETraduzirLibras = function(texto) {
        var container = document.getElementById('vlibras-container');
        if (container) container.style.display = 'block';

        if (window.vlibrasCarregado && window.plugin && window.plugin.player) {
          if (texto) window.plugin.player.translate(texto);
          return;
        }

        // Se ainda não foi carregado, injeta o script do VLibras dinamicamente
        if (!document.getElementById('vlibras-script')) {
          var script = document.createElement('script');
          script.id = 'vlibras-script';
          script.src = 'https://vlibras.gov.br/app/vlibras-plugin.js';
          script.async = true;

          script.onload = function() {
            if (window.VLibras) {
              new window.VLibras.Widget({
                rootPath: 'https://vlibras.gov.br/app',
                personalization: 'https://vlibras.gov.br/config/default.json'
              });

              window.vlibrasCarregado = true;

              // Aguarda a inicialização do Player WebGL para traduzir o texto
              var checkPlayer = setInterval(function() {
                if (window.plugin && window.plugin.player && typeof window.plugin.player.translate === 'function') {
                  clearInterval(checkPlayer);
                  if (texto) window.plugin.player.translate(texto);
                }
              }, 500);
            }
          };

          document.body.appendChild(script);
        }
      };
    </script>

    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js').then(function(registration) {
            console.log('Service Worker registrado com sucesso:', registration.scope);
          }).catch(function(err) {
            console.log('Falha no registro do Service Worker:', err);
          });
        });
      }
    </script>

    <!-- Bundle Principal -->
    <script src="/index-899d8bb1ae58be1faf097299e5ddf3c4.js" defer></script>
  </body>
</html>

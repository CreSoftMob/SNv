  <head>

    <meta name="description" content="👍 SameNext: O Painel de Acessibilidade Bilateral para o seu Negócio." />

    <meta name="author" content="SameNext" />
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="shortcut icon" type="image/png" href="https://samenext.com.br/logo.png" />

    <style id="expo-reset">
      html, body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* FIX DEFINITIVO: Força o container do VLibras a ficar visível e sobrepor o app */
      [vw] {
        position: fixed !important;
        right: 15px !important;
        bottom: 15px !important;
        z-index: 9999999 !important;
        display: block !important;
      }
      [vw-access-button] {
        display: block !important;
        width: 50px !important;
        height: 50px !important;
        border-radius: 50% !important;
        cursor: pointer !important;
      }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17817754700"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17817754700');
    </script>
  </head>

  <body>
    <noscript>
      Você precisa ativar o JavaScript para executar este aplicativo.
    </noscript>

    <!-- Elemento Raiz do React Native Web / Expo -->
    <div id="root"></div>

    <!-- Estrutura nativa do VLibras -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <!-- Script Oficial do VLibras -->
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      // Inicialização do widget global
      new window.VLibras.Widget({
        rootPath: 'https://vlibras.gov.br/app',
        personalization: 'https://vlibras.gov.br/config/default.json',
        opacity: 0.95
      });

      // Função global acessível pelo botão React Native
      window.traduzirTextoLibras = function(texto) {
        // 1. Força o clique no botão azul caso a janela do avatar esteja fechada
        var btnAcesso = document.querySelector('[vw-access-button]');
        if (btnAcesso) {
          btnAcesso.click();
        }

        // 2. Envia a frase para o player do VLibras traduzir
        if (texto && window.plugin && window.plugin.player) {
          window.plugin.player.translate(texto);
        } else if (texto) {
          // Caso o player ainda esteja carregando, aguarda 1 segundo e tenta novamente
          setTimeout(function() {
            if (window.plugin && window.plugin.player) {
              window.plugin.player.translate(texto);
            }
          }, 1200);
        }
      };
    </script>

    <!-- Service Worker Registro -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js').then(function(registration) {
            console.log('Service Worker registrado com sucesso:', registration.scope);
          }).catch(function(err) {
            console.log('Falha no registro do Service Worker:', err);
          });
        });
      }
    </script>

    <!-- Bundle Principal da Aplicação -->
    <script src="/index-899d8bb1ae58be1faf097299e5ddf3c4.js" defer></script>
  </body>
</html>

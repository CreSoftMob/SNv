<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />

  <title>SameNext - Painel de Acessibilidade Bilateral</title>

  <meta
    name="description"
    content="👍 SameNext: O Painel de Acessibilidade Bilateral para o seu Negócio."
  />

  <meta
    name="keywords"
    content="SameNext, same next, acessibilidade, libras, PWA, app, web app"
  />

  <meta name="author" content="SameNext" />
  <meta name="referrer" content="no-referrer-when-downgrade" />

  <link rel="manifest" href="/manifest.json" />
  <link
    rel="shortcut icon"
    type="image/png"
    href="https://samenext.com.br/logo.png"
  />

  <style>
    html,
    body {
      height: 100%;
    }

    body {
      overflow: hidden;
    }

    #root {
      display: flex;
      height: 100%;
      flex: 1;
    }

    /* VLibras */
    [vw] {
      z-index: 2147483647 !important;
    }
  </style>

  <!-- Google tag -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=AW-17817754700"
  ></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'AW-17817754700');
  </script>
</head>

<body>

  <noscript>
    Você precisa ativar o JavaScript para executar este aplicativo.
  </noscript>

  <!-- React Native Web / Expo -->
  <div id="root"></div>

  <!-- ========================= -->
  <!-- VLibras                   -->
  <!-- ========================= -->

  <div vw class="enabled">

    <div vw-access-button class="active"></div>

    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>

  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

  <script>
    window.addEventListener('load', function () {

      if (
        window.VLibras &&
        typeof window.VLibras.Widget === 'function'
      ) {

        window.vlibrasWidget = new window.VLibras.Widget({
          rootPath: 'https://vlibras.gov.br/app',
          personalization: 'https://vlibras.gov.br/config/default.json',
          avatar: 'icaro',
          position: 'R'
        });

        console.log('VLibras carregado com sucesso');

      } else {

        console.error(
          'VLibras Widget não foi encontrado.'
        );

      }

    });
  </script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {

      window.addEventListener('load', function () {

        navigator.serviceWorker
          .register('/service-worker.js')
          .then(function (registration) {

            console.log(
              'Service Worker registrado com sucesso:',
              registration.scope
            );

          })
          .catch(function (err) {

            console.error(
              'Falha no registro do Service Worker:',
              err
            );

          });

      });

    }
  </script>

  <!-- Bundle React Native Web / Expo -->
  <script
    src="/index-899d8bb1ae58be1faf097299e5ddf3c4.js"
    defer
  ></script>

</html>

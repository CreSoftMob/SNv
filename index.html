      /* Container customizado do Iframe Isolado do VLibras */
      #vlibras-iframe-container {
        position: fixed;
        bottom: 10px;
        right: 10px;
        width: 320px;
        height: 500px;
        z-index: 2147483647 !important;

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17817754700"></script>

      window.dataLayer = window.dataLayer || [];

  <body>
    <noscript>
      Você precisa ativar o JavaScript para executar este aplicativo.
    </noscript>

    <!-- Elemento Raiz do React Native Web / Expo -->
    <div id="root"></div>

    <!-- Container em Iframe Isolado (Bypassa bloqueios de CORS e Storage) -->
    <div id="vlibras-iframe-container">
      <iframe 
        id="vlibras-frame"
        srcdoc='
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <style>
                body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
                [vw] { position: absolute !important; right: 0 !important; bottom: 0 !important; }
              </style>
            </head>
            <body>
              <div vw class="enabled">
                <div vw-access-button class="active"></div>
                <div vw-plugin-wrapper>
                  <div class="vw-plugin-top-wrapper"></div>
                </div>
              </div>
              <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
              <script>
                new window.VLibras.Widget({
                  rootPath: "https://vlibras.gov.br/app",
                  personalization: "https://vlibras.gov.br/config/default.json"
                });

                window.addEventListener("message", function(event) {
                  if (event.data && event.data.type === "TRADUZIR_LIBRAS") {
                    var btnAcesso = document.querySelector("[vw-access-button]");
                    if (btnAcesso) btnAcesso.click();

                    function tentar(i) {
                      if (window.plugin && window.plugin.player && typeof window.plugin.player.translate === "function") {
                        window.plugin.player.translate(event.data.texto);
                      } else if (i < 20) {
                        setTimeout(function() { tentar(i + 1); }, 500);
                      }
                    }
                    tentar(0);
                  }
                });
              </script>
            </body>
          </html>
        '
      ></iframe>
    </div>

    <script>
      // Função acionada pela sua aplicação React Native Web
      window.traduzirTextoLibras = function(texto) {
        var iframe = document.getElementById('vlibras-frame');
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage({
            type: 'TRADUZIR_LIBRAS',
            texto: texto
          }, '*');
        }
      };
    </script>

    <!-- Service Worker Registro -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js').then(function(registration) {
            console.log('Service Worker registrado com sucesso:', registration.scope);
          }).catch(function(err) {
            console.log('Falha no registro do Service Worker:', err);
          });
        });
      }
    </script>

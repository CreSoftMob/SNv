    <style id="expo-reset">
      html, body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Garante que a div de acesso do VLibras e os elementos gerados fiquem acima do React Native */
      #vlibras-access-wrapper,
      #vlibras-app-root,
      div[vw] {
        z-index: 2147483647 !important;
      }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17817754700"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17817754700');
    </script>
  </head>

  <body>
    <noscript>
      Você precisa ativar o JavaScript para executar este aplicativo.
    </noscript>

    <!-- Elemento Raiz do React Native Web / Expo -->
    <div id="root"></div>

    <!-- Estrutura Nao-Sandboxed e limpa do VLibras (conforme a imagem) -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <!-- Script Oficial Atualizado (Versao Module exata do print) -->
    <script type="module" src="https://vlibras.gov.br/app/vlibras-plugin-app.js?v=7.9.1" async></script>

    <script>
      // Função global acessível pelo React Native para traduzir textos dinamicamente
      window.traduzirTextoLibras = function(texto) {
        // 1. Tenta acionar pelo botão do Shadow Root ou botão padrão
        var btnAccess = document.querySelector('[vw-access-button]') || 
                        document.querySelector('#vlibras-button') ||
                        (document.querySelector('#vlibras-access-wrapper') && 
                         document.querySelector('#vlibras-access-wrapper').shadowRoot && 
                         document.querySelector('#vlibras-access-wrapper').shadowRoot.querySelector('button'));

        if (btnAccess) {
          btnAccess.click();
        }

        // 2. Tenta enviar o texto para tradução
        function executarTraducoes(tentativas) {
          if (window.plugin && window.plugin.player && typeof window.plugin.player.translate === 'function') {
            window.plugin.player.translate(texto);
          } else if (tentativas < 15) {
            setTimeout(function() {
              executarTraducoes(tentativas + 1);
            }, 500);
          }
        }

        if (texto) {
          executarTraducoes(0);
        }
      };
    </script>

    <!-- Service Worker Registro -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js').then(function(registration) {
            console.log('Service Worker registrado com sucesso:', registration.scope);
          }).catch(function(err) {
            console.log('Falha no registro do Service Worker:', err);
          });
        });
      }
    </script>

    <!-- Bundle Principal -->
    <script src="/index-899d8bb1ae58be1faf097299e5ddf3c4.js" defer></script>
  </body>

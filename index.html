<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SameNext - Painel de Acessibilidade Bilateral</title>
    
    <meta name="description" content="👍 SameNext: O Painel de Acessibilidade Bilateral para o seu Negócio." />
    <meta name="keywords" content="SameNext, same next, acessibilidade, libras, PWA, app, web app" />
    <meta name="author" content="SameNext" />
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="shortcut icon" type="image/png" href="https://samenext.com.br/logo.png" />

    <style id="expo-reset">
      html, body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Estilo inicial do container VLibras: visível para o script carregar, mas sem atrapalhar a tela */
      #vlibras-wrapper {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 999999;
      }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17817754700"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17817754700');
    </script>
  </head>

  <body>
    <noscript>
      Você precisa ativar o JavaScript para executar este aplicativo.
    </noscript>

    <!-- Elemento Raiz do React Native Web / Expo -->
    <div id="root"></div>

    <!-- Estrutura nativa requerida pelo VLibras -->
    <div id="vlibras-wrapper">
      <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
          <div class="vw-plugin-top-wrapper"></div>
        </div>
      </div>
    </div>

    <!-- Gerenciador On-Demand de Inicialização do VLibras -->
    <script>
      window.vlibrasIniciado = false;

      window.carregarETraduzirLibras = function(texto) {
        // Se já foi iniciado, faz a tradução e força a abertura da janela do avatar
        if (window.vlibrasIniciado && window.plugin && window.plugin.player) {
          abrirETraduzir(texto);
          return;
        }

        // Se o script do VLibras ainda não foi carregado na página
        if (!document.getElementById('vlibras-script')) {
          var script = document.createElement('script');
          script.id = 'vlibras-script';
          script.src = 'https://vlibras.gov.br/app/vlibras-plugin.js';
          script.async = true;

          script.onload = function() {
            if (window.VLibras) {
              new window.VLibras.Widget({
                rootPath: 'https://vlibras.gov.br/app',
                personalization: 'https://vlibras.gov.br/config/default.json'
              });

              window.vlibrasIniciado = true;

              // Aguarda o Player 3D carregar e executa
              var tentas = 0;
              var checkPlayer = setInterval(function() {
                tentas++;
                if (window.plugin && window.plugin.player && typeof window.plugin.player.translate === 'function') {
                  clearInterval(checkPlayer);
                  abrirETraduzir(texto);
                }
                if (tentas > 30) clearInterval(checkPlayer); // Timeout de segurança (15 segundos)
              }, 500);
            }
          };

          document.body.appendChild(script);
        }
      };

      function abrirETraduzir(texto) {
        // Clica no botão azul do VLibras para abrir a janela se estiver fechada
        var btnAcesso = document.querySelector('[vw-access-button]');
        if (btnAcesso) {
          btnAcesso.click();
        }

        // Envia o texto para ser traduzido pelo robô
        if (texto && window.plugin && window.plugin.player) {
          setTimeout(function() {
            window.plugin.player.translate(texto);
          }, 300);
        }
      }
    </script>

    <!-- Service Worker Registro -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js').then(function(registration) {
            console.log('Service Worker registrado com sucesso:', registration.scope);
          }).catch(function(err) {
            console.log('Falha no registro do Service Worker:', err);
          });
        });
      }
    </script>

    <!-- Bundle Principal -->
    <script src="/index-899d8bb1ae58be1faf097299e5ddf3c4.js" defer></script>
  </body>
</html>
